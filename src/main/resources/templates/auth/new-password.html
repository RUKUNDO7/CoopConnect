<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Set New Password</title>
</head>
<body>
<div layout:fragment="content">
    <div class="container" style="max-width: 480px; margin-top: 1.5rem;">
        <div class="card" style="box-shadow: var(--shadow-lg);">
            <div class="card-header" style="text-align: center; display: block; padding: 2rem 2rem 1rem;">
                <h2 style="font-size: 1.5rem; font-weight: 800; color: var(--primary-dark);" th:text="#{auth.reset.new_password}">Set New Password</h2>
                <p style="color: var(--text-muted); font-size: 0.875rem; margin-top: 0.25rem;">
                    Please enter and confirm your new password below.
                </p>
            </div>

            <div class="card-body" style="padding: 1.5rem 2rem 2rem;">
                <form th:action="@{/reset-password/confirm}" th:object="${newPasswordRequest}" method="post">
                    <input type="hidden" th:field="*{token}">

                    <div class="form-group">
                        <label for="newPassword" class="form-label" th:text="#{auth.reset.new_password}">New Password</label>
                        <input type="password" id="newPassword" th:field="*{newPassword}" class="form-control"
                               placeholder="Min. 8 characters" required autofocus>
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword" class="form-label" th:text="#{auth.reset.confirm_password}">Confirm Password</label>
                        <input type="password" id="confirmPassword" th:field="*{confirmPassword}" class="form-control"
                               placeholder="••••••••" required>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block btn-lg" th:text="#{auth.reset.update_btn}">
                        Set New Password
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
