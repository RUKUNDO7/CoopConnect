<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Reset Password</title>
</head>
<body>
<div layout:fragment="content">
    <div class="container" style="max-width: 480px; margin-top: 1.5rem;">
        <div class="card" style="box-shadow: var(--shadow-lg);">
            <div class="card-header" style="text-align: center; display: block; padding: 2rem 2rem 1rem;">
                <h2 style="font-size: 1.5rem; font-weight: 800; color: var(--primary-dark);" th:text="#{auth.reset.title}">Reset Password</h2>
                <p style="color: var(--text-muted); font-size: 0.875rem; margin-top: 0.25rem;" th:text="#{auth.reset.instruction}">
                    Enter your registered email address to receive password reset instructions.
                </p>
            </div>

            <div class="card-body" style="padding: 1.5rem 2rem 2rem;">
                <div th:if="${resetLink}" style="margin-bottom: 1.5rem; padding: 1rem; background-color: var(--status-info-bg); border-radius: var(--radius-md);">
                    <p style="font-size: 0.875rem; color: var(--status-info); font-weight: 600; margin-bottom: 0.5rem;">Demo Password Reset Link Generated:</p>
                    <a th:href="@{${resetLink}}" class="btn btn-sm btn-primary">Set New Password Now</a>
                </div>

                <form th:action="@{/reset-password}" th:object="${passwordResetRequest}" method="post">
                    <div class="form-group">
                        <label for="email" class="form-label" th:text="#{auth.login.email}">Email Address</label>
                        <input type="email" id="email" th:field="*{email}" class="form-control"
                               placeholder="name@domain.rw" required autofocus>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block btn-lg" th:text="#{auth.reset.btn}">
                        Request Reset Link
                    </button>
                </form>

                <div style="margin-top: 2rem; padding-top: 1.25rem; border-top: 1px solid var(--border-light); text-align: center; font-size: 0.875rem;">
                    <a th:href="@{/login}" style="font-weight: 700;">&larr; Back to Sign In</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
