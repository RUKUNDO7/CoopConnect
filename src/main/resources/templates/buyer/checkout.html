<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Checkout & Mobile Payment</title>
</head>
<body>
<div layout:fragment="content">
    <div class="container" style="max-width: 760px;">
        <div style="margin-bottom: 1.5rem;">
            <a th:href="@{/cart}" style="font-weight: 600;">&larr; Return to Cart</a>
            <h1 style="font-size: 2rem; font-weight: 800; color: var(--primary-dark); margin-top: 0.5rem;">
                Checkout & Mobile Payment
            </h1>
        </div>

        <div class="card" style="box-shadow: var(--shadow-md); margin-bottom: 2rem;">
            <div class="card-header">
                <h3 style="font-size: 1.1rem; font-weight: 700;">Order Summary</h3>
            </div>
            <div class="card-body" style="padding: 1.25rem 1.5rem;">
                <ul style="list-style: none; padding-left: 0;">
                    <li th:each="item : ${cart.items}" style="display: flex; justify-content: space-between; padding: 0.6rem 0; border-bottom: 1px solid var(--border-light);">
                        <div>
                            <strong th:text="${item.listing.title}">Produce</strong>
                            <span style="color: var(--text-muted); font-size: 0.8125rem;"
                                  th:text="${' (' + item.quantity + ' ' + item.listing.unit + ' @ ' + item.listing.pricePerUnit + ' RWF)'}"></span>
                        </div>
                        <div style="font-weight: 700;" th:text="${#numbers.formatDecimal(item.listing.pricePerUnit * item.quantity, 1, 'COMMA', 0, 'POINT')} + ' RWF'">
                            48,000 RWF
                        </div>
                    </li>
                </ul>

                <div style="display: flex; justify-content: space-between; align-items: baseline; margin-top: 1rem; padding-top: 1rem;">
                    <span style="font-size: 1.1rem; font-weight: 700;">Total Amount:</span>
                    <span style="font-size: 1.5rem; font-weight: 800; color: var(--primary);"
                          th:text="${#numbers.formatDecimal(cartTotal, 1, 'COMMA', 0, 'POINT')} + ' RWF'">
                        48,000 RWF
                    </span>
                </div>
            </div>
        </div>

        <!-- Payment Selection Form -->
        <div class="card" style="box-shadow: var(--shadow-md);">
            <div class="card-header">
                <h3 style="font-size: 1.1rem; font-weight: 700;">Select Rwanda Mobile Money Provider</h3>
            </div>
            <div class="card-body" style="padding: 1.5rem;">
                <form th:action="@{/checkout}" th:object="${checkoutRequest}" method="post">
                    
                    <div class="form-group">
                        <label class="form-label">Payment Channel</label>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                            <label style="border: 2px solid var(--border-color); border-radius: var(--radius-md); padding: 1rem; cursor: pointer; display: flex; align-items: center; gap: 0.75rem;">
                                <input type="radio" th:field="*{provider}" value="MTN_MOMO" checked>
                                <div>
                                    <strong style="color: #D97706;">MTN MoMo</strong>
                                    <div style="font-size: 0.75rem; color: var(--text-muted);">Mobile Money Rwanda (*182#)</div>
                                </div>
                            </label>

                            <label style="border: 2px solid var(--border-color); border-radius: var(--radius-md); padding: 1rem; cursor: pointer; display: flex; align-items: center; gap: 0.75rem;">
                                <input type="radio" th:field="*{provider}" value="AIRTEL_MONEY">
                                <div>
                                    <strong style="color: #DC2626;">Airtel Money</strong>
                                    <div style="font-size: 0.75rem; color: var(--text-muted);">Airtel Money Rwanda (*500#)</div>
                                </div>
                            </label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="phoneNumber" class="form-label">Payment Mobile Number</label>
                        <input type="tel" id="phoneNumber" th:field="*{phoneNumber}" class="form-control"
                               placeholder="e.g. 0788XXXXXX" required>
                        <div class="form-error" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}"></div>
                        <span class="form-text">A payment prompt will be simulated to this phone number.</span>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                        <div class="form-group">
                            <label for="deliveryDistrict" class="form-label">Destination District</label>
                            <input type="text" id="deliveryDistrict" th:field="*{deliveryDistrict}" class="form-control"
                                   placeholder="e.g. Gasabo, Kigali">
                        </div>

                        <div class="form-group">
                            <label for="deliveryAddress" class="form-label">Delivery Warehouse / Address</label>
                            <input type="text" id="deliveryAddress" th:field="*{deliveryAddress}" class="form-control"
                                   placeholder="e.g. Nyabugogo Market Stall #42">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 1.5rem;">
                        🔒 Confirm Order & Pay Now
                    </button>
                </form>
            </div>
        </div>

    </div>
</div>
</body>
</html>
