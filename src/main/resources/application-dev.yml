# =============================================
# CoopConnect — Dev Profile (H2 in-memory)
# =============================================
spring:
  datasource:
    url: jdbc:h2:mem:coopconnect;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    locations: classpath:db/migration

logging:
  level:
    rw.coopconnect: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
